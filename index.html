<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jordan M. & Associates — Engineering Consultants, Castlebar, County Mayo, Ireland.">
  <meta name="theme-color" content="#18354a">
  <title>Jordan M. &amp; Associates | Engineering Consultants</title>
  <style>
    :root { color-scheme:light; --ink:#18354a; --muted:#536574; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#fafbfc; color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    main { min-height:100vh; display:flex; justify-content:center; align-items:center; padding:48px 20px; }
    .page { width:min(100%,700px); text-align:center; }
    .logo-wrap { width: min(100%, 340px); height:300px; margin:0 auto 26px; position:relative; }
    #gyro3d { display:block; width:100%; height:100%; background:transparent; }
    .logo-fallback { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
    .logo-wrap.ready .logo-fallback { display:none; }
    h1 { margin:0; font-family:Georgia,'Times New Roman',serif; font-size:clamp(30px,5vw,44px); font-weight:normal; letter-spacing:.015em; line-height:1.2; }
    .subtitle { margin:16px 0 0; color:var(--muted); text-transform:uppercase; letter-spacing:.22em; font-size:12px; font-weight:600; }
    .rule { width:65px; height:1px; margin:36px auto; background:#a7b6c1; }
    address { font-style:normal; color:#344d60; font-size:15px; line-height:1.95; }
    .contact { margin-top:22px; display:flex; flex-direction:column; gap:10px; align-items:center; font-size:15px; }
    a { color:var(--ink); text-decoration:none; border-bottom:1px solid #a8bac7; }
    a:hover,a:focus-visible { color:#276b96; border-color:currentColor; }
    footer { margin-top:72px; color:#7a8994; font-size:12px; }
    @media(max-width:480px) { .logo-wrap { width:270px; height:245px; } .subtitle { letter-spacing:.15em; } footer { margin-top:55px; } }
  </style>
</head>
<body>
  <main>
    <div class="page">
      <div class="logo-wrap" id="logo-wrap" role="img" aria-label="Three-dimensional gyroscope with independently spinning rotor and moving gimbals">
        <canvas id="gyro3d" aria-hidden="true"></canvas>
        <img class="logo-fallback" src="logo.png" alt="" aria-hidden="true">
      </div>
      <h1>Jordan M. &amp; Associates</h1>
      <p class="subtitle">Engineering Consultants</p>
      <div class="rule" aria-hidden="true"></div>
      <address>
        Unit 15, N5 Business Park<br>
        Moneen, Castlebar<br>
        Co. Mayo, F23 H682<br>
        DX 33012 Castlebar<br>
        Ireland
      </address>
      <div class="contact">
        <a href="tel:+353949026452">+353 94 902 6452</a>
        <a href="mailto:mjordan@eircom.net">mjordan@eircom.net</a>
      </div>
      <footer>&copy; <span id="year">2026</span> Jordan M. &amp; Associates</footer>
    </div>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
  <script>
  // Self-contained 3D-projected gyroscope: no libraries, network requests or WebGL.
  (() => {
    const canvas = document.getElementById('gyro3d');
    const wrap = document.getElementById('logo-wrap');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const rotateX = (p,a) => [p[0],p[1]*Math.cos(a)-p[2]*Math.sin(a),p[1]*Math.sin(a)+p[2]*Math.cos(a)];
    const rotateY = (p,a) => [p[0]*Math.cos(a)+p[2]*Math.sin(a),p[1],-p[0]*Math.sin(a)+p[2]*Math.cos(a)];
    const rotateZ = (p,a) => [p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a),p[2]];
    let width=340,height=300;
    function resize(){
      const r=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
      width=r.width;height=r.height;
      canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener('resize',resize);resize();
    function draw(time){
      const t=reduced.matches?0:time*.001;
      ctx.clearRect(0,0,width,height);
      const scale=Math.min(width/3.9,height/3.6), cx=width/2,cy=height*.49;
      const prec=t*.23, tilt=.33+.13*Math.sin(t*.44),spin=t*3.8;
      function project(p){
        p=rotateX(p,-.26);p=rotateY(p,-.52);
        const perspective=6.8/(6.8+p[2]);
        return [cx+p[0]*scale*perspective,cy-p[1]*scale*perspective,p[2]];
      }
      function path(points,stroke,lineWidth=3,fill=null){
        ctx.beginPath();points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
        if(fill){ctx.fillStyle=fill;ctx.fill();}
        ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.lineJoin='round';ctx.stroke();
      }
      function ring(point, radius, color, thickness=7){
        const pts=[];for(let i=0;i<=160;i++)pts.push(point(i*Math.PI*2/160,radius));
        path(pts,'#3f607b',thickness+2);path(pts,color,thickness);
      }
      function sphere(p,r,color){const q=project(p);ctx.beginPath();ctx.arc(q[0],q[1],r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#46617a';ctx.lineWidth=1;ctx.stroke();}
      // Fixed stand and vertical shaft.
      path([[0,-1.02,0],[0,-1.70,0]],'#7798b5',15);
      path([[0,-1.02,0],[0,-1.70,0]],'#dbe7f0',9);
      sphere([0,-1.70,0],7,'#607f9a');
      // Outer ring precesses around the vertical axis.
      const pre=p=>rotateY(p,prec);
      ring(a=>pre([1.32*Math.cos(a),0,1.32*Math.sin(a)]),1.32,'#b6cadc',8);
      // Inner gimbal tilts about the moving horizontal axle.
      const inner=p=>pre(rotateX(p,tilt));
      ring(a=>inner([0,1.12*Math.cos(a),1.12*Math.sin(a)]),1.12,'#8eafcc',7);
      // Rotor disk is oriented perpendicular to the axle and has spinning spokes.
      const rotor=p=>inner(rotateX(p,spin));
      const disc=[];for(let i=0;i<=120;i++){const a=i*Math.PI*2/120;disc.push(rotor([0,.76*Math.cos(a),.76*Math.sin(a)]));}
      path(disc,'#5a7d9c',4,'rgba(159,189,215,.24)');
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4;
        const p1=[0,.12*Math.cos(a),.12*Math.sin(a)];
        const p2=[0,.69*Math.cos(a),.69*Math.sin(a)];
        // Spin around the axle (X axis), not the page centre.
        const r1=inner(rotateX(p1,spin)),r2=inner(rotateX(p2,spin));
        path([r1,r2],i%2?'#9dbad3':'#426d93',3);
      }
      // Central axle and end bearings.
      path([inner([-.99,0,0]),inner([.99,0,0])],'#536f89',10);
      path([inner([-.99,0,0]),inner([.99,0,0])],'#dce8f0',6);
      sphere(inner([0,0,0]),7,'#e5eef5');
      sphere(pre([1.32,0,0]),5,'#dce8f0');sphere(pre([-1.32,0,0]),5,'#dce8f0');
      if(!reduced.matches) requestAnimationFrame(draw);
    }
    wrap.classList.add('ready');
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
