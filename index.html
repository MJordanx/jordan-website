
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description"
        content="Jordan M. & Associates — Forensic Engineering Consultants, Castlebar, County Mayo, Ireland.">

  <meta name="theme-color" content="#ffffff">

  <title>Jordan M. & Associates | Forensic Engineering Consultants</title>

  <style>
    :root {
      --blue: #30357e;
      --ink: #202020;
      --muted: #555555;
      --line: #30357e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      padding: 38px 28px 24px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Main letterhead arrangement */

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 35px;
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(31px, 4vw, 54px);
      font-weight: normal;
      line-height: 1.15;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }

    .initial {
      color: var(--blue);
      font-size: 1.15em;
    }

    .subtitle {
      margin: 9px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    /* Animated gyroscope */

    .logo-wrap {
      flex: 0 0 260px;
      width: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .logo-placeholder {
      display: none;
      width: 150px;
      height: 150px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: var(--blue);
    }

    /* Fine letterhead divider */

    .rule {
      width: 100%;
      height: 2px;
      background: var(--line);
      margin: 16px 0 20px;
    }

    /* Professional and contact details */

    .details {
      text-align: center;
      font-size: 15px;
      line-height: 1.7;
    }

    .credentials {
      margin: 0 0 5px;
    }

    .credentials strong {
      font-weight: bold;
    }

    address {
      font-style: normal;
      line-height: 1.6;
      margin: 0;
    }

    .contact {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 26px;
      font-size: 15px;
    }

    a {
      color: var(--ink);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: var(--blue);
      text-decoration: underline;
    }

    footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid #c9ccd9;
      text-align: center;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    /* Tablet and mobile layout */

    @media (max-width: 900px) {
      h1 {
        font-size: clamp(27px, 4vw, 40px);
        white-space: normal;
      }

      .logo-wrap {
        flex-basis: 210px;
        width: 210px;
      }
    }

    @media (max-width: 650px) {
      main {
        padding: 25px 18px;
      }

      .brand {
        flex-direction: column-reverse;
        gap: 10px;
        text-align: center;
      }

      .logo-wrap {
        flex: 0 0 auto;
        width: 190px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 0.1em;
      }

      .rule {
        margin: 20px 0;
      }

      .details {
        font-size: 14px;
      }

      .contact {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="page">

      <!-- Letterhead-style header -->
      <header class="brand">

        <div class="brand-text">
          <h1>
            <span class="initial">J</span>ordan
            <span class="initial">M</span>.
            &amp;
            <span class="initial">A</span>ssociates
          </h1>

          <p class="subtitle">
            Consultant Forensic Engineers
          </p>
        </div>

        <div class="logo-wrap">
          <img
            class="logo"
            src="Jordan_Gyroscope_Web.webp"
            alt="Jordan M. & Associates animated 3D gyroscope"
            width="500"
            height="500"
            onerror="this.style.display='none';document.getElementById('logo-placeholder').style.display='flex'">

          <div id="logo-placeholder"
               class="logo-placeholder"
               aria-hidden="true">JM</div>
        </div>

      </header>

      <div class="rule" aria-hidden="true"></div>

      <!-- Professional and contact details -->
      <section class="details">

        <p class="credentials">
          <strong>Dr. Mark F. Jordan</strong><br>
          BE MSc PhD CEng FIEI FIMechE FCIBSE FCIArbI
        </p>

        <address>
          Unit 15, N5 Business Park<br>
          Moneen, Castlebar<br>
          Co. Mayo, F23 H682<br>
          Ireland<br>
          DX 33012 Castlebar
        </address>

        <div class="contact">
          <a href="tel:+353949026452">
            Tel: +353 94 902 6452
          </a>

          <a href="mailto:mjordan@eircom.net">
            mjordan@eircom.net
          </a>
        </div>

      </section>

      <footer>
        &copy; <span id="year">2026</span>
        Jordan M. &amp; Associates
      </footer>

    </div>
  </main>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
